name: Publish NPM
on:
  push:
    tags:
      - 'v*'
jobs:
  # A release runs the full suite; publish only happens if it passes.
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify the package installs and imports
        run: |
          mkdir -p /tmp/pack /tmp/smoke
          npm pack --pack-destination /tmp/pack
          cd /tmp/smoke
          npm init -y
          npm install /tmp/pack/*.tgz
          echo 'import { dial } from "webdial"; if (typeof dial !== "function") throw new Error("dial missing"); console.log("ESM import works!");' > test.mjs
          node test.mjs
      - name: Publish package
        run: |
          npm install -g npm@latest
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
          npm publish --access public --provenance
